[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/tmp/nginx-error.log
stdout_logfile=/tmp/nginx-access.log
startretries=5
startsecs=5

[program:php-fpm]
command=php-fpm -F -R
autostart=true
autorestart=true
stderr_logfile=/tmp/php-fpm.log
stdout_logfile=/tmp/php-fpm.log
startretries=5
startsecs=5

[program:sveltekit]
command=node /var/www/html/frontend-build/index.js
autostart=true
autorestart=true
environment=PORT=3000,HOST=0.0.0.0
stderr_logfile=/tmp/sveltekit.log
stdout_logfile=/tmp/sveltekit.log
directory=/var/www/html/frontend-build
startretries=10
startsecs=10

[program:laravel-queue]
command=/usr/local/bin/queue-worker.sh
autostart=true
autorestart=true
user=nginx
numprocs=1
redirect_stderr=true
stdout_logfile=/tmp/laravel-queue.log
startretries=10
stopwaitsecs=30
killasgroup=true
stopasgroup=true

; Runs due Schedule:: entries from routes/console.php every minute.
; Without this, nightly data agent / live sync / grading never fire on their own.
[program:laravel-scheduler]
command=/usr/local/bin/schedule-worker.sh
directory=/var/www/html
autostart=true
autorestart=true
user=nginx
redirect_stderr=true
stdout_logfile=/tmp/laravel-scheduler.log
startretries=10
; Nightly data agent can run a long time; give it room to finish on stop.
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
